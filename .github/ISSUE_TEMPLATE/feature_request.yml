name: 功能建议
description: 建议新增能力、改进工作流或完善业务口径
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请说明当前流程的痛点、适用场景和影响范围。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、输入输出和可能的实现方式。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及环节
      multiple: true
      options:
        - 公告检索
        - 交易所 / 证监会数据
        - Excel 底表
        - Word / PDF / PPT
        - Wind MCP
        - 同花顺 iFinD MCP
        - 见微公告检索
        - 质量门禁与测试
        - 文档与安装
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性与影响
      description: 是否影响既有口径、模板、脚本参数或历史成果？
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 本建议不包含密钥、客户信息、个人信息或未公开交易信息
          required: true

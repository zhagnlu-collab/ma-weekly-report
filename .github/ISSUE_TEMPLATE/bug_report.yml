name: 缺陷报告
description: 报告脚本、文档、工作簿生成或质量门禁问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先删除 MCP 密钥、客户信息、个人信息和本机绝对路径，再提交。
  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 请描述预期行为与实际行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小、可重复的步骤和脱敏命令。
      placeholder: |
        1. 运行 ...
        2. 打开 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: 受影响文件或功能
      description: 例如 auto_run.py、某个 Excel sheet、Word 生成、MCP 取数、质量门禁。
    validations:
      required: true
  - type: dropdown
    id: data_source
    attributes:
      label: 相关数据源
      multiple: true
      options:
        - 官方交易所 / 证监会 / 巨潮
        - Wind MCP
        - 同花顺 iFinD MCP
        - 见微公告检索
        - Microsoft Office / LibreOffice / PDF
        - 其他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 请提供操作系统、Python 版本、Codex/浏览器版本和相关依赖；不要填写账号或密钥。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志或截图
      description: 仅提供定位问题所需的最小信息。
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 我已删除密钥、客户信息、个人信息和本机绝对路径
          required: true
